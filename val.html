<!DOCTYPE html>
<html>
<head>
<title>My Valentine ❤️</title>
</head>
<body>


<h1>Happy Valentine’s Day ❤️</h1>
<h2>Dear Abigail,</h2>


<p>
Loving you has been one of the best decisions of my life.
Every day with you feels special, and I’m grateful for you.
</p>


<button onclick="showLove()">Forever Yours 💌</button>


<p id="secret" style="display:none;">
Abigail ❤️, loving you is my favorite thing to do every day.
You are my Valentine today and always 💕
</p>


<script>
function showLove() {
document.getElementById("secret").style.display = "block";
}
</script>


</body>
</html>
